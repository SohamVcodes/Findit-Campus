<!-- public/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - Findit@Campus</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <div class="login-card">
      <h2>Login to Findit@Campus</h2>
      <p class="note">Please login using your VIT email credentials. Admins have special access.</p>
      <form id="loginForm">
        <input type="email" id="email" placeholder="you@vit.edu" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
      <div id="error" class="error-box"></div>
    </div>
  </div>
  <script src="client.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value.trim();
      const err = document.getElementById('error');
      err.style.display = 'none';
      // demo passwords
      const adminPass = 'admin123';
      const studentPass = 'student123';
      let role = null;
      if (email === 'admin@vit.edu' && pass === adminPass) role = 'admin';
      else if (email.endsWith('@vit.edu') && pass === studentPass) role = 'user';
      if (!role) {
        err.textContent = '❌ Invalid email or password.';
        err.style.display = 'block';
        return;
      }
      localStorage.setItem('userEmail', email);
      localStorage.setItem('role', role);
      if (role === 'admin') window.location.href = '/admin.html';
      else window.location.href = '/index.html';
    });
  </script>
</body>
</html>
